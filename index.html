    const callGeminiAPI = async (prompt, systemInstruction = "", isJson = false, schema = null) => {
      const url = `${WORKER_URL}/generate-text`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {}
      };

      if (systemInstruction && systemInstruction.trim()) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      if (isJson) {
        payload.generationConfig.responseMimeType = "application/json";
        if (schema) {
          payload.generationConfig.responseSchema = schema;
        }
      }

      const maxRetries = 5;
      const baseDelay = 1000;

      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error?.message || errorData.message || `API error: ${response.status}`);
          }

          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!text) throw new Error("No text in response");

          if (isJson) {
            const cleanText = text.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '').trim();
            try {
              return JSON.parse(cleanText);
            } catch (parseError) {
              const jsonMatch = cleanText.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
              if (jsonMatch) {
                return JSON.parse(jsonMatch[0]);
              }
              throw parseError;
            }
          }
          return text;
        } catch (error) {
          if (attempt === maxRetries - 1) {
            throw new Error(`APIの呼び出しに失敗しました。詳細: ${error.message}`);
          }
          await new Promise(resolve => setTimeout(resolve, baseDelay * Math.pow(2, attempt)));
        }
      }
    };

    const generateImageAPI = async (prompt) => {
      const url = `${WORKER_URL}/generate-image`;
      
      const payload = {
        instances: [{ prompt: prompt }],
        parameters: { sampleCount: 1 }
      };

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error?.message || errorData.message || `画像生成APIエラー: ${response.status}`);
      }

      const data = await response.json();
      if (data.predictions && data.predictions[0] && data.predictions[0].bytesBase64Encoded) {
        return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
      } else {
        throw new Error("画像の生成に失敗しました。");
      }
    };

                              placeholder={isSuggestingBenefit ? "💡AIが最適な提供価値を提案中..." : "例: 毎日の選択に迷わなくなり、ストレスフリーで成果を出せる具体的な手順"}
                              className="w-full p-3 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                              rows={2}
                            />
                          </div>

                          <div className="pt-4 flex justify-end">
                            <button
                              onClick={generateToc}
                              disabled={loading || isSuggestingBenefit}
                              className="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-indigo-500 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 shadow-sm"
                            >
                              {loading ? <Loader2 /> : <ChevronRight />}
                              このテーマ・設定で目次を作る
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {toc && (
                    <div className="space-y-3 animate-fade-in">
                      <div className="flex items-center justify-between">
                        <h3 className="text-sm font-bold text-slate-700">目次案 (自由に編集できます)</h3>
                        <button onClick={() => handleCopy(toc, 'toc')} className="text-slate-400 hover:text-slate-600 flex items-center gap-1 text-xs">
                          {copiedStates['toc'] ? <Check className="w-4 h-4 text-green-500" /> : <Copy className="w-4 h-4" />} コピー
                        </button>
                      </div>
                      <textarea
                        value={toc}
                        onChange={(e) => setToc(e.target.value)}
                        rows={10}
                        className="w-full p-4 border border-slate-300 rounded-lg text-sm leading-relaxed focus:ring-2 focus:ring-indigo-500 outline-none font-mono"
                      />
                      <div className="flex justify-end pt-4">
                        <button
                          onClick={() => setActiveTab(2)}
                          className="bg-slate-800 text-white px-8 py-3 rounded-lg font-bold hover:bg-slate-700 transition-colors shadow-md"
                        >
                          Step 2: 本文執筆へ進む
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 2 && (
                <div className="space-y-6 animate-fade-in">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h2 className="text-lg font-bold flex items-center gap-2">
                      <span className="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">2</span>
                      目次から本文をAI執筆 {creationMode === "experience" && "（70歳フリーランスYoshiBonモード）"} {creationMode === "research" && "（Geminiリサーチ解析モード）"}
                    </h2>
                  </div>
                  
                  {!toc ? (
                    <div className="text-center py-10 bg-slate-50 rounded-lg border border-dashed border-slate-300">
                      <p className="text-slate-500 mb-4">まだ目次が作成されていません。</p>
                      <button onClick={() => setActiveTab(1)} className="text-indigo-600 font-medium hover:underline">
                        Step 1に戻って目次を作成する
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <button
                        onClick={generateArticle}
                        disabled={loading}
                        className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-500 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 shadow-md text-lg"
                      >
                        {loading ? <><Loader2 className="w-5 h-5 animate-spin" /> 本文を執筆中...</> : <><PenTool className="w-5 h-5" /> AIで本文を一気に書き上げる ({targetWordCount}字目標)</>}
                      </button>

                      {articleBody && (
                        <div className="space-y-3 mt-6 animate-fade-in">
                          <div className="flex items-center justify-between">
                            <h3 className="text-sm font-bold text-slate-700">生成された本文</h3>
                            <button onClick={() => handleCopy(articleBody, 'body')} className="text-slate-500 hover:text-indigo-600 flex items-center gap-1 text-sm bg-slate-100 px-3 py-1 rounded">
                              {copiedStates['body'] ? <><Check className="text-green-500" /> コピー完了</> : <><Copy /> 全てコピー</>}
                            </button>
                          </div>
                          <textarea
                            value={articleBody}
                            onChange={(e) => setArticleBody(e.target.value)}
                            rows={18}
                            className="w-full p-5 border border-slate-300 rounded-lg text-base leading-relaxed focus:ring-2 focus:ring-indigo-500 outline-none font-sans"
                          />

                          {/* 🎁 購入者限定特典資料の独立一括生成セクション */}
                          <div className="pt-6 border-t border-slate-200 mt-8 space-y-4">
                            <div className="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl shadow-sm">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div>
                                  <h4 className="font-bold text-amber-950 text-base flex items-center gap-2">
                                    <span>🎁</span> 【有料note購入者限定】特権・特典資料の自動生成
                                  </h4>
                                  <p className="text-xs text-amber-800 mt-1 leading-relaxed">
                                    購入後の満足度を高める「コピペ用実践テンプレート」「AIプロンプト集」「チェックリスト」「ワークシート」を独立した別資料として一瞬で作成します。
                                  </p>
                                </div>
                                <button
                                  onClick={generateBonusDocument}
                                  disabled={isGeneratingBonus}
                                  className="bg-amber-600 hover:bg-amber-500 text-white px-6 py-3 rounded-xl font-bold shadow-md transition-all flex items-center justify-center gap-2 flex-shrink-0 disabled:opacity-50 text-sm"
                                >
                                  {isGeneratingBonus ? (
                                    <><Loader2 className="w-4 h-4 animate-spin" /> 特典資料を作成中...</>
                                  ) : (
                                    <><Sparkles className="w-4 h-4 text-amber-200" /> 特典資料を一括生成</>
                                  )}
                                </button>
                              </div>

                              {bonusDocument && (
                                <div className="mt-5 pt-4 border-t border-amber-200/60 space-y-3 animate-fade-in">
                                  <div className="flex items-center justify-between">
                                    <span className="text-xs font-bold text-amber-900 bg-amber-100 px-2.5 py-1 rounded-md">
                                      完成した特典資料 (配布用・コピペOK)
                                    </span>
                                    <button 
                                      onClick={() => handleCopy(bonusDocument, 'bonus-doc')} 
                                      className="text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors shadow-sm"
                                    >
                                      {copiedStates['bonus-doc'] ? <><Check className="w-3.5 h-3.5 text-amber-200" /> コピー完了！</> : <><Copy className="w-3.5 h-3.5" /> 特典資料をコピー</>}
                                    </button>
                                  </div>
                                  <textarea
                                    value={bonusDocument}
                                    onChange={(e) => setBonusDocument(e.target.value)}
                                    rows={12}
                                    className="w-full p-4 border border-amber-300 rounded-xl text-sm leading-relaxed focus:ring-2 focus:ring-amber-500 outline-none font-sans bg-white text-slate-800"
                                  />
                                </div>
                              )}
                            </div>
                          </div>

                          <div className="flex justify-end pt-4 gap-3">
                            <button
                              onClick={generateMarketing}
                              disabled={loading}
                              className="bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-indigo-500 transition-colors shadow-md flex items-center gap-2"
                            >
                              {loading ? <Loader2 /> : <Share2 className="w-4 h-4" />}
                              Step 3: 集客コピー作成へ進む
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 3 && (
                <div className="space-y-8 animate-fade-in">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h2 className="text-lg font-bold flex items-center gap-2">
                      <span className="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">3</span>
                      4大SNS集客告知コピー＆タイトル候補
                    </h2>
                  </div>

                  {!marketingData ? (
                    <div className="text-center py-12 bg-slate-50 rounded-xl border border-dashed border-slate-300 space-y-4">
                      <p className="text-slate-500">まだSNS投稿文が作成されていません。</p>
                      <button
                        onClick={generateMarketing}
                        disabled={loading}
                        className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-500 transition-all shadow-md inline-flex items-center gap-2"
                      >
                        {loading ? <Loader2 /> : <Sparkles />}
                        今すぐSNS集客文を一括生成する
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-8 animate-fade-in">
                      {/* Title Suggestions */}
                      {marketingData.titles && marketingData.titles.length > 0 && (
                        <div className="space-y-3 bg-indigo-50/60 p-5 rounded-2xl border border-indigo-100">
                          <h3 className="font-bold text-indigo-950 text-base flex items-center gap-2">
                            <span>💡</span> おすすめキャッチコピー・タイトル案 (売れたタイトル構造採用)
                          </h3>
                          <div className="space-y-2">
                            {marketingData.titles.map((title, idx) => (
                              <div key={idx} className="flex items-center justify-between bg-white p-3 rounded-lg border border-indigo-100 text-sm font-medium text-slate-800">
                                <span>{title}</span>
                                <button
                                  onClick={() => handleCopy(title, `title-${idx}`)}
                                  className="text-xs bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 px-2.5 py-1 rounded transition-colors flex items-center gap-1"
                                >
                                  {copiedStates[`title-${idx}`] ? <Check className="w-3.5 h-3.5 text-green-500" /> : <Copy className="w-3.5 h-3.5" />}
                                  コピー
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* X (Twitter) */}
                      <div className="space-y-4 p-5 bg-slate-900 text-white rounded-2xl shadow-md">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                          <h3 className="font-bold text-base flex items-center gap-2">
                            <span>𝕏</span> 𝕏 (Twitter) 投稿テンプレート
                          </h3>
                          <span className="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">シャドウデモート完全回避設計</span>
                        </div>
                        
                        <div className="space-y-3">
                          <div>
                            <div className="flex justify-between text-xs text-slate-400 mb-1">
                              <span>【1/2】親ツイート（文字数140字以内・URL無し）</span>
                              <button onClick={() => handleCopy(marketingData.x_post, 'x_post')} className="text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                                {copiedStates['x_post'] ? <Check className="w-3 h-3 text-green-400" /> : <Copy className="w-3 h-3" />} コピー
                              </button>
                            </div>
                            <textarea
                              value={marketingData.x_post}
                              onChange={(e) => setMarketingData({ ...marketingData, x_post: e.target.value })}
                              rows={4}
                              className="w-full p-3 bg-slate-800 text-slate-100 rounded-lg text-sm outline-none border border-slate-700 focus:border-indigo-500"
                            />
                          </div>

                          <div>
                            <div className="flex justify-between text-xs text-slate-400 mb-1">
                              <span>【2/2】子ツイート（リプライ欄用・誘導コピー＋URL）</span>
                              <button onClick={() => handleCopy(marketingData.x_reply, 'x_reply')} className="text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                                {copiedStates['x_reply'] ? <Check className="w-3 h-3 text-green-400" /> : <Copy className="w-3 h-3" />} コピー
                              </button>
                            </div>
                            <textarea
                              value={marketingData.x_reply}
                              onChange={(e) => setMarketingData({ ...marketingData, x_reply: e.target.value })}
                              rows={3}
                              className="w-full p-3 bg-slate-800 text-slate-100 rounded-lg text-sm outline-none border border-slate-700 focus:border-indigo-500"
                            />
                          </div>
                        </div>
                      </div>

                      {/* Threads */}
                      <div className="space-y-4 p-5 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                          <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                            <span>🌀</span> Threads (スレッド形式投稿)
                          </h3>
                          <button onClick={() => handleCopy(marketingData.threads.join('\n\n---\n\n'), 'threads')} className="text-xs text-slate-500 hover:text-indigo-600 flex items-center gap-1">
                            {copiedStates['threads'] ? <Check className="w-3.5 h-3.5 text-green-500" /> : <Copy className="w-3.5 h-3.5" />} 全文コピー
                          </button>
                        </div>
                        <div className="space-y-3">
                          {marketingData.threads.map((t, idx) => (
                            <div key={idx} className="relative">
                              <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full mb-1 inline-block">
                                Post {idx + 1}
                              </span>
                              <textarea
                                value={t}
                                onChange={(e) => {
                                  const updated = [...marketingData.threads];
                                  updated[idx] = e.target.value;
                                  setMarketingData({ ...marketingData, threads: updated });
                                }}
                                rows={3}
                                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Facebook & Instagram */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Facebook */}
                        <div className="space-y-3 p-5 bg-blue-50/50 rounded-2xl border border-blue-100">
                          <div className="flex items-center justify-between border-b border-blue-100 pb-2">
                            <h3 className="font-bold text-sm text-blue-950 flex items-center gap-1.5">
                              <span>📘</span> Facebook用長文投稿
                            </h3>
                            <button onClick={() => handleCopy(marketingData.facebook_post, 'fb')} className="text-xs text-blue-600 hover:underline flex items-center gap-1">
                              {copiedStates['fb'] ? <Check className="w-3.5 h-3.5 text-green-500" /> : <Copy className="w-3.5 h-3.5" />} コピー
                            </button>
                          </div>
                          <textarea
                            value={marketingData.facebook_post}
                            onChange={(e) => setMarketingData({ ...marketingData, facebook_post: e.target.value })}
                            rows={8}
                            className="w-full p-3 bg-white border border-blue-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>

                        {/* Instagram */}
                        <div className="space-y-3 p-5 bg-pink-50/50 rounded-2xl border border-pink-100">
                          <div className="flex items-center justify-between border-b border-pink-100 pb-2">
                            <h3 className="font-bold text-sm text-pink-950 flex items-center gap-1.5">
                              <span>📸</span> Instagramキャプション
                            </h3>
                            <button onClick={() => handleCopy(marketingData.instagram_post, 'insta')} className="text-xs text-pink-600 hover:underline flex items-center gap-1">
                              {copiedStates['insta'] ? <Check className="w-3.5 h-3.5 text-green-500" /> : <Copy className="w-3.5 h-3.5" />} コピー
                            </button>
                          </div>
                          <textarea
                            value={marketingData.instagram_post}
                            onChange={(e) => setMarketingData({ ...marketingData, instagram_post: e.target.value })}
                            rows={8}
                            className="w-full p-3 bg-white border border-pink-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-pink-500"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end pt-4">
                        <button
                          onClick={() => setActiveTab(4)}
                          className="bg-slate-800 text-white px-8 py-3 rounded-lg font-bold hover:bg-slate-700 transition-colors shadow-md flex items-center gap-2"
                        >
                          Step 4: サムネイル作成へ進む <ChevronRight className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 4 && (
                <div className="space-y-8 animate-fade-in">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h2 className="text-lg font-bold flex items-center gap-2">
                      <span className="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">4</span>
                      AIアイキャッチ・サムネイル画像生成
                    </h2>
                  </div>

                  {/* Style Presets */}
                  <div className="space-y-3">
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                      スタイルプリセットを選択 (全10種)
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-72 overflow-y-auto pr-1">
                      {THUMBNAIL_STYLES.map((style) => (
                        <div
                          key={style.id}
                          onClick={() => setSelectedStyleId(style.id)}
                          className={`p-3.5 rounded-xl border cursor-pointer transition-all ${
                            selectedStyleId === style.id
                              ? "bg-indigo-50 border-indigo-500 ring-2 ring-indigo-500/20 shadow-sm"
                              : "bg-white border-slate-200 hover:border-indigo-300"
                          }`}
                        >
                          <div className="font-bold text-sm text-slate-800">{style.name}</div>
                          <div className="text-xs text-slate-500 mt-1 leading-relaxed">{style.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Aspect Ratio */}
                  <div className="space-y-2">
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">アスペクト比（縦横比）</label>
                    <div className="flex gap-3">
                      {[
                        { id: "16:9", label: "16:9 (note / YouTube標準)" },
                        { id: "1:1", label: "1:1 (正方形)" },
                        { id: "9:16", label: "9:16 (縦長)" }
                      ].map((ratio) => (
                        <button
                          key={ratio.id}
                          type="button"
                          onClick={() => setAspectRatio(ratio.id)}
                          className={`flex-1 py-2.5 px-3 rounded-lg border text-xs font-bold transition-all ${
                            aspectRatio === ratio.id
                              ? "bg-slate-900 border-slate-900 text-white shadow-sm"
                              : "bg-white border-slate-200 text-slate-700 hover:border-slate-300"
                          }`}
                        >
                          {ratio.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Generate Button */}
                  <button
                    onClick={generateThumbnailImage}
                    disabled={isGeneratingImage}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-bold shadow-md transition-all flex items-center justify-center gap-2 text-base disabled:opacity-50"
                  >
                    {isGeneratingImage ? (
                      <><Loader2 className="w-5 h-5 animate-spin" /> サムネイル画像を生成中...</>
                    ) : (
                      <><ImageIcon className="w-5 h-5" /> 選択したスタイルでアイキャッチ画像を生成</>
                    )}
                  </button>

                  {/* Generated Prompt Output */}
                  {generatedImagePrompt && (
                    <div className="space-y-2 pt-2 animate-fade-in">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                          生成に使用されたMidjourney / Imagenプロンプト
                        </label>
                        <button
                          onClick={() => handleCopy(generatedImagePrompt, 'img-prompt')}
                          className="text-xs text-indigo-600 hover:underline flex items-center gap-1 font-medium"
                        >
                          {copiedStates['img-prompt'] ? <Check className="w-3.5 h-3.5 text-green-500" /> : <Copy className="w-3.5 h-3.5" />}
                          プロンプトをコピー
                        </button>
                      </div>
                      <div className="p-3 bg-slate-100 rounded-lg border border-slate-200 text-xs font-mono text-slate-700 break-all">
                        {generatedImagePrompt}
                      </div>
                    </div>
                  )}

                  {/* Image Display Output */}
                  {generatedImageUrl && (
                    <div className="space-y-4 pt-4 border-t border-slate-200 animate-fade-in text-center">
                      <div className="relative inline-block overflow-hidden rounded-2xl border border-slate-200 shadow-lg max-w-full">
                        <img
                          src={generatedImageUrl}
                          alt="AI生成アイキャッチ"
                          className="max-h-[450px] w-auto object-contain mx-auto"
                        />
                      </div>
                      <div>
                        <a
                          href={generatedImageUrl}
                          download="note_thumbnail.png"
                          className="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-md text-sm"
                        >
                          <Download className="w-4 h-4" />
                          完成した画像をダウンロード
                        </a>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
